[project]
name = "flightlogger"
dynamic = ["version"]
description = "PX4 ULog viewer with video sync, Flight Review graphs and timeline notes"
requires-python = ">=3.10"
dependencies = [
    # PySide6 6.12.0 aborts at exit ("free(): invalid pointer") once ~13 pyqtgraph plots
    # exist (reproduces with plain pyqtgraph, no FlightLogger code); 6.11.x is clean.
    # QtAds 5.1.1.1 needs exactly 6.12.0, so it is capped too.
    "pyside6>=6.11,<6.12",
    "pyside6-qtads>=5.1.1,<5.1.1.1",
    "pyqtgraph>=0.13.7",
    "pyulog>=1.1",
    "numpy",
    "scipy",
    "python-mpv>=1.0",
    "requests",
]

[project.scripts]
flightlogger = "flightlogger.__main__:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.dynamic]
version = {attr = "flightlogger.__version__"}

[tool.setuptools.packages.find]
include = ["flightlogger*"]

[tool.setuptools.package-data]
flightlogger = ["resources/*.svg", "log/*.md"]
