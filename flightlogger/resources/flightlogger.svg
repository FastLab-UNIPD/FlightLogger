<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <!-- FlightLogger logo: the OmniQuadGUI drone (X-frame, four rotors, hub), upright and
       centred, with its hub on the trace of a flight-log graph that climbs
       diagonally behind it; the time cursor drops from the hub. -->
