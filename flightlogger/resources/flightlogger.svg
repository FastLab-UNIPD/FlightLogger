    <linearGradient id="fl-area" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9b87e0" stop-opacity="0.50"/>
      <stop offset="1" stop-color="#9b87e0" stop-opacity="0.02"/>
    </linearGradient>
    <linearGradient id="fl-line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8670d4"/>
      <stop offset="1" stop-color="#d4caf7"/>
    </linearGradient>
    <clipPath id="fl-plot"><rect x="40" y="68" width="176" height="136" rx="8"/></clipPath>
  </defs>

